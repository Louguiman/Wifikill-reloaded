name: Production Release

on:
  push:
    branches: [prod]

concurrency:
  group: prod-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --no-daemon --console=plain

      - name: Lint
        run: ./gradlew lint --no-daemon --console=plain

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_BASE: '0.1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        run: |
          VERSION_NAME="${VERSION_BASE}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          VERSION_CODE=$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Building v${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/release.keystore"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
          echo "ANDROID_KEYSTORE_FILE=${KEYSTORE_FILE}" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not configured"
              exit 1
            fi
          done

      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionCode="${VERSION_CODE}" \
            -PversionName="${VERSION_NAME}" \
            --no-daemon \
            --console=plain

      - name: Verify and stage APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK}" ]; then
            echo "::error::Release APK was not produced at ${APK}"
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="$(find "${SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::apksigner was not found in the Android SDK"
            exit 1
          fi
          "${APKSIGNER}" verify --print-certs "${APK}"
          cp "${APK}" "wifikill-v${VERSION_NAME}.apk"
          sha256sum "wifikill-v${VERSION_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: WiFiKill Reloaded v${{ env.VERSION_NAME }}
          body: |
            Automated production build from the `prod` branch.

            Commit: `${{ github.sha }}`
            Version code: `${{ env.VERSION_CODE }}`
          files: wifikill-v${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"
